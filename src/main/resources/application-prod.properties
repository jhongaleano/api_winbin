# Perfil de producción — activar en Render con: SPRING_PROFILES_ACTIVE=prod

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# Render: confiar en headers X-Forwarded-* del proxy
server.forward-headers-strategy=framework

# URL pública de la API (Render también inyecta RENDER_EXTERNAL_URL)
server.url=${RENDER_EXTERNAL_URL:https://api-winbin.onrender.com}

# OpenAPI / Swagger UI habilitado en producción
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
